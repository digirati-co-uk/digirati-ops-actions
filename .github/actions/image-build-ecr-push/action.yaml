name: Build image and push to ECR.
description: "TODO"

inputs:
  repository_name:
    description: 'ECR repository name'
    required: true
  docker_context:
    description: 'Path in code repo containing the Dockerfile to build.'
    required: true
  app_version:
    description: 'App version tag to be included in image as APP_VERSION env variable.'
    required: true
  environment_tag:
    description: 'Environment tag to use for the built image, e.g. "dev", "prod"'
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Docker metadata
      id: docker-meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{steps.login-ecr.outputs.registry}}/${{inputs.repository_name}}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,format=short # Same tag as generated by APP_VERSION step
          type=raw,value=${{ inputs.environment_tag }},enable=${{ inputs.environment_tag != '' }}
          type=sha,enable=true,prefix=,format=long
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push
      id: docker-build
      uses: docker/build-push-action@v6
      with:
        context: ${{inputs.docker_context}}
        builder: ${{ steps.buildx.outputs.name }}
        tags: ${{ steps.docker-meta.outputs.tags }}
        labels: ${{ steps.docker-meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ inputs.app_version || 'not_set' }}
        push: true
